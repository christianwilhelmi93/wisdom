name: Deploy + daily wallpaper
on:
  schedule: [{cron: "30 2 * * *"}]   # ~03:30/04:30 Oslo, before the morning Shortcut
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-dejavu >/dev/null || true
      - run: chmod +x build_wallpapers.sh && TZ=Europe/Oslo ./build_wallpapers.sh 7 && ls wallpaper
      - run: mkdir -p _site && cp -r index.html *.js *.css manifest.webmanifest .nojekyll icons dream wallpaper README.md _site/
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
